# Production stack for a single-server deploy (DigitalOcean droplet).
#   caddy (public :80/:443, auto-HTTPS) -> api (:5000) -> db (:5432, internal only)
#
# Usage on the server:
#   cp .env.production.example .env   # then fill in real secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only Caddy publishes ports to the host. The API and Postgres are reachable
# ONLY on the internal Docker network — never from the public internet.
services:
  db:
    image: postgres:16
    container_name: cm-pharmacy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - cm_pharmacy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: cm-pharmacy-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # db is the service name above; resolves on the internal Docker network.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      CLIENT_URL: ${CLIENT_URL}
      PORT: "5000"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    container_name: cm-pharmacy-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  cm_pharmacy_pgdata:
  caddy_data:
  caddy_config:
